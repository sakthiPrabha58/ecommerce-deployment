[jenkins]
jenkins-server ansible_host=<JENKINS_PUBLIC_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/cloudforge-key.pem

[sonarqube]
sonarqube-server ansible_host=<SONARQUBE_PUBLIC_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/cloudforge-key.pem

[nexus]
nexus-server ansible_host=<NEXUS_PUBLIC_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/cloudforge-key.pem

[all:vars]
ansible_python_interpreter=/usr/bin/python3
